<title>IDVET Products Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Single light look on purpose: it mirrors the live IDVET site, which is light-only. */
:root{
  color-scheme: light;
  --brand-500:#0676bd; --brand-600:#0075be; --brand-700:#006eb3; --brand-hover:#0568a8;
  --navy:#0b1f36; --navy-2:#12304f;
  --ink:#1a1a1a; --body:#4d4d4d; --muted:#848484;
  --surface:#f0efef; --surface-2:#f7f7f7; --line:rgba(11,31,54,.09); --line-2:rgba(11,31,54,.16);
  --white:#ffffff;
  --pdf:#c8413b;
  --radius:16px;
  --wrap:1200px;
  --font:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --latin:"Roboto", "Segoe UI", Arial, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--white);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}
.latin{font-family:var(--latin);direction:ltr;unicode-bidi:isolate}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:24px}
@media (max-width:640px){.wrap{padding-inline:16px}}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}

/* ---------- Review bar (prototype only) ---------- */
.review{background:#fff8e6;border-bottom:1px solid #f0dca6;color:#6b5314;font-size:13px}
.review .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:8px}
.review strong{font-weight:600}
.review nav{display:flex;flex-wrap:wrap;gap:6px}
.review button{border:1px solid #e3c877;background:#fff;border-radius:999px;padding:2px 12px;font-size:12.5px}
.review button[aria-current="true"]{background:#6b5314;color:#fff;border-color:#6b5314}

/* ---------- Header (same as site) ---------- */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--white);border-bottom:1px solid var(--line)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;height:78px}
.site-header .logo img{height:46px;width:auto;display:block}
.site-nav{display:flex;gap:30px;color:var(--brand-500);font-size:16px}
.site-nav a:hover{text-decoration:underline}
.site-nav a.on{font-weight:700}
.lang{height:40px;min-width:140px;border:1px solid var(--brand-500);border-radius:25px;color:var(--brand-500);font-family:var(--latin);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;padding-inline:14px}
.burger{display:none;width:40px;height:40px;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.burger span{display:block;width:24px;height:2px;background:var(--brand-500)}
@media (max-width:900px){.site-nav,.lang{display:none}.burger{display:flex}.site-header .wrap{height:68px}.site-header .logo img{height:40px}}

/* ---------- Breadcrumb ---------- */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.crumbs a,.crumbs button{opacity:.75}
.crumbs a:hover,.crumbs button:hover{opacity:1;text-decoration:underline}
.crumbs .sep{opacity:.45}
.crumbs [aria-current]{font-weight:600;opacity:1}

/* ---------- Page band (navy, like the hero) ---------- */
.band{position:relative;background:var(--navy);color:#fff;overflow:hidden;isolation:isolate}
.band::before{content:"";position:absolute;inset:0;background-image:var(--hero);background-size:cover;background-position:right center;transform:scaleX(-1);opacity:.55;z-index:-2}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(to left,var(--navy) 30%,rgba(11,31,54,.82) 58%,rgba(11,31,54,.25));z-index:-1}
.band .wrap{padding-block:40px 44px;display:grid;gap:14px}
.band .eyebrow{font-size:14px;font-weight:600;color:#9fd0f2}
.band h1{font-size:40px;font-weight:700}
.band .lead{max-width:60ch;color:rgba(255,255,255,.86);font-size:16px}
.band .stats{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:6px;font-size:14px;color:rgba(255,255,255,.8)}
.band .stats b{color:#fff;font-weight:700;font-family:var(--latin);font-size:18px;margin-inline-end:6px}
.search{display:flex;max-width:520px;margin-top:8px;background:#fff;height:50px}
.search input{flex:1;min-width:0;border:0;padding-inline:16px;font:inherit;color:var(--ink);background:transparent}
.search input:focus{outline:none}
.search button{background:var(--brand-500);color:#fff;padding-inline:22px;font-weight:600;display:flex;align-items:center;gap:8px}
.search button:hover{background:var(--brand-hover)}
.band.cat .wrap{padding-block:34px 36px}
.band .cat-head{display:flex;align-items:center;gap:18px}
.band .cat-icon{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.band .cat-icon svg{width:40px;height:40px}
@media (max-width:640px){.band h1{font-size:30px}.band .cat-icon{width:56px;height:56px}}

/* ---------- Section heading with the dotted line from the Brands section ---------- */
.sec{padding-block:56px}
.sec.alt{background:var(--surface)}
.sec-head{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.sec-head h2{font-size:26px;color:var(--brand-600);font-weight:700;white-space:nowrap}
.sec-head .rule{flex:1;height:2px;background:#c9c9c9;position:relative;border-radius:2px}
.sec-head .rule::before,.sec-head .rule::after{content:"";position:absolute;top:50%;width:7px;height:7px;border-radius:50%;background:#9a9a9a;transform:translateY(-50%)}
.sec-head .rule::before{right:0}.sec-head .rule::after{left:0}
.sec-head .meta{font-size:14px;color:var(--muted);white-space:nowrap}

/* ---------- Category cards ---------- */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media (max-width:1000px){.cats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.cats{grid-template-columns:1fr}}
.cat-card{display:flex;flex-direction:column;gap:12px;text-align:start;background:var(--tint);border:2px solid transparent;border-radius:var(--radius);padding:22px;transition:border-color .2s, transform .2s}
.cat-card:hover{border-color:color-mix(in srgb,var(--brand-600) 45%,transparent);transform:translateY(-3px)}
.cat-card .ic{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center}
.cat-card .ic svg{width:34px;height:34px}
.cat-card h3{font-size:18px;color:var(--brand-600);font-weight:700}
.cat-card p{font-size:13.5px;color:var(--body);line-height:1.65}
.cat-card .go{margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600;color:var(--brand-600)}
.cat-card .go .n{color:var(--muted);font-weight:500}
.cat-card .arrow{display:inline-flex;transition:transform .2s}
.cat-card:hover .arrow{transform:translateX(-4px)}

/* ---------- Product cards ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.grid.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:1000px){.grid,.grid.three{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.grid,.grid.three{grid-template-columns:1fr}}
.p-card{display:flex;flex-direction:column;text-align:start;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .2s, box-shadow .2s}
.p-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px -18px rgba(11,31,54,.45)}
.p-card .ph{aspect-ratio:4/3;background:var(--tint);display:grid;place-items:center;position:relative;max-width:100%}
.p-card .ph svg{width:78%;height:auto;transition:transform .35s}
.p-card:hover .ph svg{transform:scale(1.04)}
.p-card .ph .imgs{position:absolute;bottom:10px;inset-inline-start:10px;background:rgba(255,255,255,.9);border-radius:999px;font-size:11.5px;padding:1px 9px;color:var(--body);display:flex;align-items:center;gap:4px}
.p-card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.p-card .cat-l{font-size:12px;color:var(--muted)}
.p-card h3{font-size:16px;font-weight:700;color:var(--brand-600);line-height:1.45}
.p-card .brand{font-size:12.5px;color:var(--body)}
.p-card .ft{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line-2);margin-top:12px;font-size:12.5px}
.pdf-badge{display:inline-flex;align-items:center;gap:6px;color:var(--body)}
.pdf-badge .tag{font-family:var(--latin);font-size:10px;font-weight:700;color:#fff;background:var(--pdf);padding:1px 5px;border-radius:3px;letter-spacing:.04em}
.p-card .more{color:var(--brand-600);font-weight:600;display:flex;align-items:center;gap:4px}

/* ---------- Category page layout ---------- */
.cat-layout{display:grid;grid-template-columns:260px 1fr;gap:32px;align-items:start}
@media (max-width:900px){.cat-layout{grid-template-columns:1fr}}
.side{position:sticky;top:100px;display:flex;flex-direction:column;gap:6px}
.side h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.side button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-align:start;border:2px solid transparent;font-size:14.5px;color:var(--brand-600)}
.side button .ic{width:38px;height:38px;border-radius:50%;background:var(--tint);display:grid;place-items:center;flex:none}
.side button .ic svg{width:22px;height:22px}
.side button .n{margin-inline-start:auto;font-family:var(--latin);font-size:12.5px;color:var(--muted)}
.side button:hover{background:var(--surface-2)}
.side button[aria-current="true"]{background:var(--tint);border-color:var(--brand-600);font-weight:700}
@media (max-width:900px){
  .side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:8px}
  .side h4{display:none}
  .side button{flex:none;border:1px solid var(--line-2);border-radius:999px;padding:6px 14px 6px 8px}
  .side button .ic{width:30px;height:30px}.side button .ic svg{width:18px;height:18px}
}
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.toolbar .count{font-size:14px;color:var(--body)}
.toolbar .count b{font-family:var(--latin);color:var(--ink)}
.toolbar select{height:40px;border:1px solid var(--line-2);background:#fff;padding-inline:12px;font:inherit;font-size:14px;color:var(--ink)}

/* ---------- Product detail ---------- */
.crumb-bar{background:var(--surface);color:var(--body)}
.crumb-bar .wrap{padding-block:14px}
.pd{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:start;padding-block:40px 56px}
@media (max-width:960px){.pd{grid-template-columns:1fr;gap:28px;padding-block:24px 40px}}
.gal{position:sticky;top:100px;display:grid;gap:12px}
@media (max-width:960px){.gal{position:static}}
.gal-main{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--tint);border-radius:var(--radius);display:grid;place-items:center;overflow:hidden;cursor:zoom-in}
.gal-main svg{width:82%;height:auto}
.gal-main .cnt{position:absolute;top:14px;inset-inline-start:14px;background:rgba(255,255,255,.92);border-radius:999px;padding:2px 12px;font-family:var(--latin);font-size:12.5px;color:var(--body)}
.gal-main .zoom{position:absolute;bottom:14px;inset-inline-start:14px;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--brand-600);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.gal-main .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--brand-600);opacity:0;transition:opacity .2s}
.gal-main:hover .nav{opacity:1}
.gal-main .nav.prev{right:14px}.gal-main .nav.next{left:14px}
@media (hover:none){.gal-main .nav{opacity:1}}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.thumbs button{aspect-ratio:1/1;max-width:100%;border-radius:12px;background:var(--tint);display:grid;place-items:center;border:2px solid transparent;opacity:.72;transition:opacity .2s,border-color .2s}
.thumbs button svg{width:80%;height:auto}
.thumbs button:hover{opacity:1}
.thumbs button[aria-current="true"]{border-color:var(--brand-600);opacity:1}

.info{display:grid;gap:22px}
.info .top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--brand-700);color:var(--brand-600);background:#fff;border-radius:999px;padding:3px 12px 3px 6px;font-size:13px}
.chip .ic{width:24px;height:24px;border-radius:50%;background:var(--tint);display:grid;place-items:center}
.chip .ic svg{width:16px;height:16px}
.brand-logo{height:30px;display:flex;align-items:center}
.brand-logo img{height:100%;width:auto}
.info h1{font-size:34px;font-weight:700;color:var(--brand-600)}
.info .latin-name{font-size:15px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.info .desc{color:var(--body);font-size:16px;line-height:1.85;max-width:62ch}
.specs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin:0}
.specs div{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.specs div:nth-child(odd){padding-inline-end:16px}
.specs dt{font-size:12.5px;color:var(--muted)}
.specs dd{margin:0;font-size:14.5px;font-weight:600;color:var(--ink)}
@media (max-width:480px){.specs{grid-template-columns:1fr}.specs div:nth-child(odd){padding-inline-end:0}}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.btn{height:48px;padding-inline:24px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:14.5px;transition:background .2s}
.btn.primary{background:var(--brand-500);color:#fff}
.btn.primary:hover{background:var(--brand-hover)}
.btn.ghost{border:1px solid var(--brand-500);color:var(--brand-500);font-weight:500}
.btn.ghost:hover{background:color-mix(in srgb,var(--brand-500) 7%,transparent)}

.certs{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.certs-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.certs-h h3{font-size:16px;color:var(--ink);font-weight:700;display:flex;align-items:center;gap:8px}
.certs-h span{font-size:13px;color:var(--muted)}
.cert{display:flex;align-items:center;gap:14px;padding:14px 18px;width:100%;text-align:start;border-bottom:1px solid var(--line);transition:background .15s}
.cert:last-child{border-bottom:0}
.cert:hover{background:color-mix(in srgb,var(--brand-500) 5%,#fff)}
.cert .file{width:40px;height:48px;flex:none;position:relative}
.cert .file svg{width:100%;height:100%}
.cert .txt{flex:1;min-width:0;display:grid}
.cert .txt b{font-size:14.5px;font-weight:600;color:var(--ink)}
.cert .txt small{font-size:12.5px;color:var(--muted)}
.cert .view{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--brand-600);border:1px solid var(--brand-600);padding:5px 12px}
.cert:hover .view{background:var(--brand-600);color:#fff}
.no-certs{padding:16px 18px;font-size:14px;color:var(--muted)}

.long{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding-block:48px;border-top:1px solid var(--line)}
@media (max-width:860px){.long{grid-template-columns:1fr;gap:28px}}
.long h2{font-size:20px;color:var(--brand-600);margin-bottom:12px}
.long p{color:var(--body);line-height:1.9;max-width:62ch}
.long ol{margin:0;padding-inline-start:20px;color:var(--body);display:grid;gap:6px}
.long ol li::marker{color:var(--brand-600);font-family:var(--latin);font-weight:700}

/* ---------- CTA strip + footer ---------- */
.cta-strip{background:var(--brand-700);color:#fff}
.cta-strip .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-block:34px}
.cta-strip h3{font-size:22px;font-weight:700}
.cta-strip p{color:rgba(255,255,255,.85);font-size:14.5px;margin-top:4px}
.cta-strip .btn{background:#fff;color:var(--brand-700);border-radius:999px}
footer.site{background:var(--brand-700);color:#fff;text-align:center;font-weight:300;font-size:14px;padding-block:18px;border-top:1px solid rgba(255,255,255,.3)}

/* ---------- Modals ---------- */
.modal{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:rgba(6,16,29,.92);color:#fff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.m-bar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#0b1f36;border-bottom:1px solid rgba(255,255,255,.1)}
.m-bar .ttl{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:500}
.m-bar .ttl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-bar .tools{display:flex;align-items:center;gap:4px}
.m-bar .tools button{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:#fff}
.m-bar .tools button:hover{background:rgba(255,255,255,.1)}
.m-bar .tools .z{font-family:var(--latin);font-size:13px;min-width:48px;text-align:center;color:rgba(255,255,255,.8)}
.m-bar .sep{width:1px;height:22px;background:rgba(255,255,255,.18);margin-inline:6px}
.m-body{flex:1;overflow:auto;display:flex;justify-content:center;padding:28px 16px}
.pdf-page{background:#fff;color:#1a1a1a;width:min(640px,100%);aspect-ratio:1/1.414;box-shadow:0 20px 60px rgba(0,0,0,.5);transform-origin:top center;padding:7% 8%;display:flex;flex-direction:column;gap:3.2%;font-family:var(--latin);direction:ltr;text-align:left;flex:none}
.pdf-page .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--pc);padding-bottom:3%}
.pdf-page .org{font-weight:700;font-size:clamp(11px,2.2vw,15px);color:var(--pc)}
.pdf-page .org small{display:block;font-weight:400;color:#777;font-size:.75em}
.pdf-page .seal{width:13%;aspect-ratio:1;border-radius:50%;border:2px solid var(--pc);display:grid;place-items:center;font-size:clamp(7px,1.2vw,9px);font-weight:700;color:var(--pc);text-align:center;line-height:1.1}
.pdf-page h5{margin:0;text-align:center;font-size:clamp(13px,2.8vw,20px);letter-spacing:.12em;text-transform:uppercase}
.pdf-page .sub{text-align:center;color:#666;font-size:clamp(9px,1.6vw,12px)}
.pdf-page table{width:100%;border-collapse:collapse;font-size:clamp(8px,1.5vw,11.5px)}
.pdf-page td,.pdf-page th{border:1px solid #d9d9d9;padding:1.2% 2%;text-align:left}
.pdf-page th{background:#f3f5f7;font-weight:600}
.pdf-page .lines{display:grid;gap:6px;margin-top:auto}
.pdf-page .lines i{display:block;height:6px;background:#eceff2;border-radius:3px}
.pdf-page .sign{display:flex;justify-content:space-between;font-size:clamp(8px,1.4vw,11px);color:#555;border-top:1px solid #ddd;padding-top:2%}
.m-foot{display:flex;justify-content:center;gap:10px;padding:10px;font-size:13px;color:rgba(255,255,255,.7);font-family:var(--latin)}

.lb-body{flex:1;display:grid;place-items:center;position:relative;padding:20px 70px;min-height:0}
.lb-body .stage{width:min(76vh,100%);aspect-ratio:1;max-width:100%;background:var(--tint);border-radius:18px;display:grid;place-items:center}
.lb-body .stage svg{width:84%;height:auto}
.lb-body .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.lb-body .nav:hover{background:rgba(255,255,255,.22)}
.lb-body .prev{right:14px}.lb-body .next{left:14px}
@media (max-width:640px){.lb-body{padding:16px}.lb-body .nav{top:auto;bottom:18px;transform:none}}
.lb-thumbs{display:flex;justify-content:center;gap:10px;padding:14px;flex-wrap:wrap}
.lb-thumbs button{width:62px;height:62px;border-radius:10px;background:var(--tint);display:grid;place-items:center;border:2px solid transparent;opacity:.6}
.lb-thumbs button svg{width:80%}
.lb-thumbs button[aria-current="true"]{border-color:#fff;opacity:1}

.fade-in{animation:rise .35s ease-out}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function label(x,y,w,h,p,acc,back){
  const b = BRANDS[p.brand].name;
  if (back) {
    let l=""; for(let i=0;i<6;i++) l+=`<rect x="${x+w*.12}" y="${y+h*.2+i*h*.1}" width="${w*(i%2?.6:.76)}" height="${h*.035}" rx="2" fill="#c9d2dc"/>`;
    let bc=""; for(let i=0;i<18;i++) bc+=`<rect x="${x+w*.2+i*w*.033}" y="${y+h*.82}" width="${i%3?w*.012:w*.022}" height="${h*.1}" fill="#333"/>`;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#fff"/>${l}${bc}`;
  }
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#fff"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h*.22}" rx="6" fill="${acc}"/><rect x="${x}" y="${y+h*.14}" width="${w}" height="${h*.08}" fill="${acc}"/>
  <text x="${x+w/2}" y="${y+h*.15}" text-anchor="middle" font-family="Roboto,Arial" font-weight="700" font-size="${h*.1}" fill="#fff">${esc(b)}</text>
  <text x="${x+w/2}" y="${y+h*.47}" text-anchor="middle" font-family="Roboto,Arial" font-weight="700" font-size="${Math.min(h*.13, w*1.5/Math.max(p.latin.length,6))}" fill="#12304f">${esc(p.latin)}</text>
  <rect x="${x+w*.25}" y="${y+h*.58}" width="${w*.5}" height="${h*.035}" rx="2" fill="#c9d2dc"/>
  <rect x="${x+w*.32}" y="${y+h*.66}" width="${w*.36}" height="${h*.035}" rx="2" fill="#c9d2dc"/>
  <circle cx="${x+w/2}" cy="${y+h*.83}" r="${h*.06}" fill="none" stroke="${acc}" stroke-width="2"/>`;
}
function item(p, acc, cx, base, s, back){
  // draws one pack centred at cx, standing on y=base, scale s
  const g = (inner) => `<g transform="translate(${cx} ${base}) scale(${s}) translate(-100 -300)">${inner}</g>`;
  if (p.pack === "bottle") return g(`
    <rect x="80" y="40" width="40" height="30" rx="4" fill="${acc}"/><rect x="86" y="68" width="28" height="22" fill="#e9eef3"/>
    <path d="M86 88 Q86 108 56 122 Q44 128 44 146 V286 Q44 300 58 300 H142 Q156 300 156 286 V146 Q156 128 144 122 Q114 108 114 88Z" fill="#f4f7fa" stroke="#d3dbe3" stroke-width="2"/>
    <path d="M60 136 V284" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".8"/>
    ${label(52,160,96,118,p,acc,back)}`);
  if (p.pack === "vial") return g(`
    <rect x="70" y="120" width="60" height="22" rx="4" fill="#b8c2cc"/><rect x="74" y="112" width="52" height="12" rx="3" fill="${acc}"/>
    <path d="M78 142 V156 Q60 164 60 182 V288 Q60 300 72 300 H128 Q140 300 140 288 V182 Q140 164 122 156 V142Z" fill="#eaf1f7" stroke="#cdd7e0" stroke-width="2" opacity=".95"/>
    <path d="M70 186 V284" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    ${label(64,196,72,88,p,acc,back)}`);
  if (p.pack === "tub") return g(`
    <rect x="42" y="118" width="116" height="28" rx="6" fill="${acc}"/><rect x="42" y="140" width="116" height="6" fill="rgba(0,0,0,.12)"/>
    <path d="M46 146 H154 L150 292 Q150 300 142 300 H58 Q50 300 50 292Z" fill="#f7f9fb" stroke="#d3dbe3" stroke-width="2"/>
    ${label(58,168,84,112,p,acc,back)}`);
  // bag
  return g(`
    <path d="M30 90 Q100 76 170 90 L176 110 Q182 200 172 290 Q100 304 28 290 Q18 200 24 110Z" fill="#f6f3ea" stroke="#d9d2bf" stroke-width="2"/>
    <path d="M30 90 Q100 76 170 90 L172 102 Q100 88 28 102Z" fill="#e2dccb"/>
    <path d="M40 100 Q34 200 40 282" stroke="#fff" stroke-width="6" opacity=".7" fill="none" stroke-linecap="round"/>
    ${label(46,128,108,140,p,acc,back)}`);
}
function shadow(cx, w){ return `<ellipse cx="${cx}" cy="352" rx="${w}" ry="10" fill="rgba(11,31,54,.14)"/>`; }
function packshot(p, v=0){
  const acc = catOf(p.cat).accent;
  let body;
  if (v === 0) body = shadow(200,80) + item(p,acc,200,350,1.05);
  else if (v === 1) body = shadow(200,70) + item(p,acc,200,350,1.05,true);
  else if (v === 2) body = shadow(120,50)+shadow(280,50)+shadow(200,60) + item(p,acc,120,330,.72) + item(p,acc,280,330,.72) + item(p,acc,200,352,.86);
  else body = `<g transform="translate(200 210) scale(1.9) translate(-100 -214)">${label(52,160,96,118,p,acc)}</g>`;
  return `<svg viewBox="0 0 400 400" role="img" aria-label="${esc(p.title)}">${body}</svg>`;
}

      ${showCat ? `<span class="cat-l">${c.name}</span>` : ""}
      <h3>${esc(p.title)}</h3>
      <span class="brand"><span class="latin">${BRANDS[p.brand].name}</span> · ${BRANDS[p.brand].country}</span>
      <div class="ft">
        ${p.certs.length ? `<span class="pdf-badge"><span class="tag">PDF</span>${p.certs.length === 1 ? "شهادة واحدة" : (p.certs.length === 2 ? "شهادتين" : p.certs.length + " شهادات")}</span>` : `<span class="pdf-badge" style="color:var(--muted)">بدون شهادات</span>`}
        <span class="more">التفاصيل ${I.arrow}</span>
      </div>
    </div>
  </button>`;
}

function crumbs(items, light){
  return `<nav class="crumbs" aria-label="مسار الصفحة">${items.map((it,i) => {
    const last = i === items.length - 1;
    const el = last ? `<span aria-current="page">${it.t}</span>` : `<button data-crumb="${it.go}">${it.t}</button>`;
    return (i ? `<span class="sep">/</span>` : "") + el;
  }).join("")}</nav>`;
}

function viewIndex(){
  return `
  <section class="band"><div class="wrap">
    ${crumbs([{t:"الرئيسية",go:"home"},{t:"منتجاتنا"}])}
    <span class="eyebrow">كتالوج IDVET</span>
    <h1>منتجاتنا</h1>
    <p class="lead">أدوية بيطرية ومكملات وإضافات أعلاف من براندات نمثلها حصرياً في العراق. اختار القسم أو ابحث باسم المنتج.</p>
    <form class="search" onsubmit="event.preventDefault()"><input id="q" type="search" placeholder="ابحث باسم المنتج أو المادة الفعالة…" aria-label="بحث"><button type="submit">${I.search} بحث</button></form>
    <div class="stats"><span><b>${CATS.length}</b>أقسام</span><span><b>${PRODUCTS.length}</b>منتج</span><span><b>3</b>براندات عالمية</span></div>
  </div></section>

  <section class="sec"><div class="wrap">
    <div class="sec-head"><h2>الأقسام</h2><span class="rule"></span></div>
    <div class="cats">
      ${CATS.map(c => `<button class="cat-card" style="--tint:${c.tint}" data-cat="${c.id}">
        <span class="ic">${ICONS[c.id]}</span>
        <h3>${c.name}</h3>
        <p>${c.blurb}</p>
        <span class="go">عرض المنتجات <span><span class="n">${countIn(c.id)} منتجات</span> <span class="arrow">${I.arrow}</span></span></span>
      </button>`).join("")}
    </div>
  </div></section>

  <section class="sec alt"><div class="wrap">
    <div class="sec-head"><h2>كل المنتجات</h2><span class="rule"></span><span class="meta"><span class="latin">${PRODUCTS.length}</span> منتج</span></div>
    <div class="grid">${PRODUCTS.map(p => productCard(p)).join("")}</div>
  </div></section>`;
}

function viewCategory(){
  const c = catOf(state.cat);
  const items = PRODUCTS.filter(p => p.cat === c.id);
  return `
  <section class="band cat"><div class="wrap">
    ${crumbs([{t:"الرئيسية",go:"home"},{t:"منتجاتنا",go:"index"},{t:c.name}])}
    <div class="cat-head">
      <span class="cat-icon" style="background:${c.tint}">${ICONS[c.id]}</span>
      <div><h1>${c.name}</h1><p class="lead">${c.blurb}</p></div>
    </div>
  </div></section>

  <section class="sec"><div class="wrap cat-layout">
    <aside class="side" aria-label="الأقسام">
      <h4>الأقسام</h4>
      ${CATS.map(x => `<button data-cat="${x.id}" style="--tint:${x.tint}" aria-current="${x.id === c.id}"><span class="ic">${ICONS[x.id]}</span>${x.name}<span class="n">${countIn(x.id)}</span></button>`).join("")}
    </aside>
    <div>
      <div class="toolbar">
        <span class="count"><b>${items.length}</b> منتجات في قسم ${c.name}</span>
        <select id="sort" aria-label="ترتيب"><option>الأحدث</option><option>الاسم (أ–ي)</option><option>البراند</option></select>
      </div>
      <div class="grid three fade-in">${items.map(p => productCard(p,false)).join("")}</div>
    </div>
  </div></section>`;
}

function viewProduct(){
  const p = PRODUCTS.find(x => x.id === state.product);
  const c = catOf(p.cat);
  const related = PRODUCTS.filter(x => x.cat === p.cat && x.id !== p.id).concat(PRODUCTS.filter(x => x.cat !== p.cat)).slice(0,3);
  const certWord = n => n === 1 ? "ملف واحد" : n === 2 ? "ملفين" : n + " ملفات";
  return `
  <div class="crumb-bar"><div class="wrap">
    ${crumbs([{t:"الرئيسية",go:"home"},{t:"منتجاتنا",go:"index"},{t:c.name,go:"cat:"+c.id},{t:p.title}])}
  </div></div>

  <div class="wrap">
    <div class="pd" style="--tint:${c.tint}">
      <div class="gal">
        <div class="gal-main" id="gal-main" role="button" tabindex="0" aria-label="تكبير الصورة">
          ${packshot(p, state.img)}
          <span class="cnt"><span class="latin">${state.img+1} / 4</span></span>
          <button class="nav prev" data-img-step="-1" aria-label="السابقة">${I.prev}</button>
          <button class="nav next" data-img-step="1" aria-label="التالية">${I.next}</button>
          <span class="zoom" aria-hidden="true">${I.zoom}</span>
        </div>
        <div class="thumbs">${VIEWS.map((v,i) => `<button data-img="${i}" aria-current="${i===state.img}" aria-label="${v}">${packshot(p,i)}</button>`).join("")}</div>
      </div>

      <div class="info">
        <div class="top">
          <button class="chip" data-cat="${c.id}" style="--tint:${c.tint}"><span class="ic">${ICONS[c.id]}</span>${c.name}</button>
          <span class="brand-logo"><img src="${IMG[p.brand]}" alt="${BRANDS[p.brand].name}"></span>
        </div>
        <div>
          <h1>${esc(p.title)}</h1>
          <p class="latin-name latin">${esc(p.latin)}</p>
        </div>
        <p class="desc">${esc(p.desc)}</p>
        <dl class="specs">
          <div><dt>البراند</dt><dd><span class="latin">${BRANDS[p.brand].name}</span> — ${BRANDS[p.brand].country}</dd></div>
          <div><dt>الشكل الصيدلاني</dt><dd>${p.form}</dd></div>
          <div><dt>العبوات المتوفرة</dt><dd>${p.size}</dd></div>
          <div><dt>الحيوانات المستهدفة</dt><dd>${p.species}</dd></div>
        </dl>
        <div class="ctas">
          <a class="btn primary" href="#">اطلب عرض سعر</a>
          <a class="btn ghost" href="#">تواصل واتساب</a>
        </div>

        <section class="certs" aria-label="الشهادات">
          <div class="certs-h"><h3>${I.doc} الشهادات والوثائق</h3><span>${p.certs.length ? certWord(p.certs.length) + " PDF" : ""}</span></div>
          ${p.certs.length ? p.certs.map((ct,i) => `<button class="cert" data-cert="${i}">
            <span class="file">${pdfFile}</span>
            <span class="txt"><b>${esc(ct.name)}</b><small><span class="latin">${esc(ct.issuer)}</span> · <span class="latin">${ct.date}</span> · <span class="latin">${ct.size}</span></small></span>
            <span class="view">${I.eye} عرض</span>
          </button>`).join("") : `<p class="no-certs">لا توجد شهادات مرفوعة لهذا المنتج حالياً.</p>`}
        </section>
      </div>
    </div>

    <div class="long">
      <div><h2>عن المنتج</h2><p>${esc(p.long)}</p></div>
      <div><h2>طريقة الاستخدام</h2><ol>${p.use.map(u => `<li>${esc(u)}</li>`).join("")}</ol></div>
    </div>
  </div>

  <section class="sec alt"><div class="wrap">
    <div class="sec-head"><h2>منتجات مشابهة</h2><span class="rule"></span><button class="meta" data-cat="${c.id}" style="color:var(--brand-600);font-weight:600">كل ${c.name} ←</button></div>
    <div class="grid three">${related.map(x => productCard(x)).join("")}</div>
  </div></section>`;
}

/* ---------------- Modals ---------------- */
const modalRoot = document.getElementById("modal-root");
let lastFocus = null;
function closeModal(){ modalRoot.innerHTML = ""; document.body.style.overflow = ""; lastFocus && lastFocus.focus(); }
function openLightbox(){
  lastFocus = document.activeElement;
  const p = PRODUCTS.find(x => x.id === state.product), c = catOf(p.cat);
  const draw = () => {
    modalRoot.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="صور المنتج" dir="rtl" style="--tint:${c.tint}">
      <div class="m-bar"><div class="ttl"><span>${esc(p.title)} — ${VIEWS[state.img]}</span></div>
        <div class="tools"><span class="z">${state.img+1} / 4</span><span class="sep"></span><button data-close aria-label="إغلاق">${I.close}</button></div></div>
      <div class="lb-body"><div class="stage">${packshot(p,state.img)}</div>
        <button class="nav prev" data-lb="-1" aria-label="السابقة">${I.prev}</button><button class="nav next" data-lb="1" aria-label="التالية">${I.next}</button></div>
      <div class="lb-thumbs">${VIEWS.map((v,i)=>`<button data-lbi="${i}" aria-current="${i===state.img}" aria-label="${v}">${packshot(p,i)}</button>`).join("")}</div>
    </div>`;
    modalRoot.querySelector("[data-close]").focus();
  };
  modalRoot.onclick = e => {
    const t = e.target.closest("[data-lb],[data-lbi],[data-close]");
    if (!t) { if (e.target.classList.contains("lb-body")) { closeModal(); render(); } return; }
    if (t.dataset.close !== undefined) { closeModal(); render(); return; }
    state.img = t.dataset.lbi !== undefined ? +t.dataset.lbi : (state.img + +t.dataset.lb + 4) % 4;
    draw();
  };
  document.body.style.overflow = "hidden";
  draw();
}
function openPdf(i){
  lastFocus = document.activeElement;
  const p = PRODUCTS.find(x => x.id === state.product), ct = p.certs[i], acc = catOf(p.cat).accent;
  let zoom = 100, page = 1;
  const isCOA = ct.name.includes("COA");
  const draw = () => {
    modalRoot.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(ct.name)}" dir="rtl">
      <div class="m-bar">
        <div class="ttl"><span class="file" style="width:26px;height:32px;flex:none">${pdfFile}</span><span>${esc(ct.name)}</span></div>
        <div class="tools">
          <button data-z="-10" aria-label="تصغير">${I.minus}</button><span class="z">${zoom}%</span><button data-z="10" aria-label="تكبير">${I.plus}</button>
          <span class="sep"></span>
          <button data-dl aria-label="تحميل">${I.dl}</button>
          <button data-close aria-label="إغلاق">${I.close}</button>
        </div>
      </div>
      <div class="m-body"><div class="pdf-page" style="--pc:${acc};transform:scale(${zoom/100})">
        <div class="hd"><div class="org">${esc(ct.issuer)}<small>${isCOA ? "Quality Control Department" : "Certification Body"}</small></div><div class="seal">CERT<br>${ct.date}</div></div>
        <h5>${isCOA ? "Certificate of Analysis" : ct.name.includes("GMP") ? "GMP Certificate" : ct.name.includes("ISO") ? "ISO Certificate" : "Registration Certificate"}</h5>
        <p class="sub">${esc(p.latin)} · ${BRANDS[p.brand].name} · Page ${page} of ${ct.pages}</p>
        <table><tr><th>Parameter</th><th>Specification</th><th>Result</th></tr>
          <tr><td>Appearance</td><td>Conforms</td><td>Conforms</td></tr>
          <tr><td>Active content</td><td>95.0 – 105.0 %</td><td>99.4 %</td></tr>
          <tr><td>Moisture</td><td>≤ 5.0 %</td><td>2.1 %</td></tr>
          <tr><td>Microbial count</td><td>≤ 1000 cfu/g</td><td>&lt; 100 cfu/g</td></tr>
          <tr><td>Batch No.</td><td colspan="2">IDV-${ct.date.replace("/","")}-014</td></tr></table>
        <div class="lines"><i></i><i style="width:88%"></i><i style="width:94%"></i><i style="width:60%"></i></div>
        <div class="sign"><span>Issued: ${ct.date}</span><span>Authorized signature ____________</span></div>
      </div></div>
      <div class="m-foot">${ct.pages > 1 ? `<button data-pg="-1" aria-label="الصفحة السابقة" style="color:#fff">${I.prev}</button>` : ""}<span>Page ${page} / ${ct.pages} · ${ct.size}</span>${ct.pages > 1 ? `<button data-pg="1" aria-label="الصفحة التالية" style="color:#fff">${I.next}</button>` : ""}</div>
    </div>`;
    modalRoot.querySelector("[data-close]").focus();
  };
  modalRoot.onclick = e => {
    const t = e.target.closest("[data-z],[data-close],[data-pg],[data-dl]");
    if (!t) { if (e.target.classList.contains("m-body")) closeModal(); return; }
    if (t.dataset.close !== undefined) return closeModal();
    if (t.dataset.z) zoom = Math.max(50, Math.min(200, zoom + +t.dataset.z));
    if (t.dataset.pg) page = Math.max(1, Math.min(ct.pages, page + +t.dataset.pg));
    if (t.dataset.dl !== undefined) return;
    draw();
  };
  document.body.style.overflow = "hidden";
  draw();
}
document.addEventListener("keydown", e => {
  if (!modalRoot.firstChild) return;
  if (e.key === "Escape") { closeModal(); if (state.view === "product") render(); }
  const lb = modalRoot.querySelector("[data-lb]");
  if (lb && (e.key === "ArrowLeft" || e.key === "ArrowRight")) modalRoot.querySelector(`[data-lb="${e.key === "ArrowLeft" ? 1 : -1}"]`).click();
});

/* ---------------- Render + events ---------------- */
function renderReviewNav(){
  const screens = [
    ["index","1 · صفحة المنتجات", {view:"index"}],
    ["category","2 · صفحة القسم", {view:"category", cat: state.cat || "medicines"}],
    ["product","3 · صفحة المنتج", {view:"product", product: state.product || "amoxicillin-oral"}],
  ];
  const nav = document.getElementById("review-nav");
  nav.innerHTML = screens.map(([k,t]) => `<button data-screen="${k}" aria-current="${state.view===k}">${t}</button>`).join("")
    + `<button data-screen="pdf">4 · عرض شهادة PDF</button>`;
  nav.onclick = e => {
    const b = e.target.closest("[data-screen]"); if (!b) return;
    const k = b.dataset.screen;
    if (k === "pdf") { go({view:"product", product: state.product || "amoxicillin-oral"}); openPdf(0); return; }
    go(screens.find(s => s[0] === k)[2]);
  };
}
function render(){
  app.innerHTML = state.view === "index" ? viewIndex() : state.view === "category" ? viewCategory() : viewProduct();
  renderReviewNav();
  const q = document.getElementById("q");
  if (q) q.addEventListener("input", () => {
    const v = q.value.trim();
    const grid = app.querySelector(".sec.alt .grid");
    const list = v ? PRODUCTS.filter(p => p.title.includes(v) || p.latin.toLowerCase().includes(v.toLowerCase())) : PRODUCTS;
    grid.innerHTML = list.length ? list.map(p => productCard(p)).join("") : `<p class="empty" style="grid-column:1/-1">مفيش منتج بالاسم ده. جرّب اسم المادة الفعالة أو تصفح الأقسام.</p>`;
  });
}
app.addEventListener("click", e => {
  const t = e.target.closest("[data-product],[data-cat],[data-crumb],[data-img],[data-img-step],[data-cert],#gal-main");
  if (!t) return;
  if (t.dataset.product) return go({view:"product", product:t.dataset.product});
  if (t.dataset.cat) return go({view:"category", cat:t.dataset.cat});
  if (t.dataset.crumb) { const g = t.dataset.crumb; if (g === "home" || g === "index") return go({view:"index"}); return go({view:"category", cat:g.slice(4)}); }
  if (t.dataset.img !== undefined) { state.img = +t.dataset.img; return render(); }
  if (t.dataset.imgStep) { e.stopPropagation(); state.img = (state.img + +t.dataset.imgStep + 4) % 4; return render(); }
  if (t.dataset.cert !== undefined) return openPdf(+t.dataset.cert);
  if (t.id === "gal-main") return openLightbox();
});
app.addEventListener("keydown", e => { if (e.target.id === "gal-main" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openLightbox(); } });
document.querySelector('.site-nav [data-go]').addEventListener("click", e => { e.preventDefault(); go({view:"index"}); });
render();
</script>
