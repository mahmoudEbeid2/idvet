<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDVET Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Design reference for the IDVET admin dashboard (/admin). Light-only, Arabic RTL. */
:root{
  color-scheme: light;
  --brand:#0676bd; --brand-hover:#0568a8; --brand-600:#0075be;
  --navy:#0b1f36;
  --bg:#f4f6f8; --card:#fff; --line:#e3e8ed; --line-2:#eef1f4; --input:#d5dbe1;
  --ink:#1a1a1a; --ink-2:#2b3640; --muted:#5f6b76; --muted-2:#7a8590; --muted-3:#9aa4ae;
  --ok-bg:#effaf3; --ok-line:#bfe3cc; --ok:#1d6b3c;
  --err-bg:#fdf2f1; --err-line:#f0c9c6; --err:#a1302a; --danger:#b3342e;
  --info-bg:#f0f7fd; --info-line:#c6ddef; --info:#12507e;
  --pdf:#c8413b;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --latin:"Roboto","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.latin{font-family:var(--latin);direction:ltr;unicode-bidi:isolate}
[hidden]{display:none!important}

/* review bar (prototype only) */
.review{background:#fff8e6;border-bottom:1px solid #f0dca6;color:#6b5314;font-size:13px;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.review strong{font-weight:600}
.review nav{display:flex;flex-wrap:wrap;gap:6px}
.review button{border:1px solid #e3c877;background:#fff;border-radius:999px;padding:2px 12px;font-size:12.5px}
.review button[aria-current="true"]{background:#6b5314;color:#fff;border-color:#6b5314}

/* shell */
.shell{display:flex;min-height:calc(100vh - 42px)}
.side{width:240px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{display:flex;align-items:center;gap:12px;padding:24px 20px}
.side .brand span.logo{background:#fff;border-radius:8px;padding:6px 8px;display:flex}
.side .brand img{height:28px;width:auto;display:block}
.side .brand small{color:rgba(255,255,255,.7);font-size:14px}
.side nav{display:flex;flex-direction:column;gap:4px;padding:0 12px 16px;flex:1}
.side nav a,.side nav button{display:block;text-align:start;border-radius:8px;padding:10px 12px;font-size:15px;color:rgba(255,255,255,.8)}
.side nav a:hover,.side nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.side nav a[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.side nav .out{margin-top:auto;color:rgba(255,255,255,.6)}
.main{flex:1;min-width:0;padding:32px}
.container{max-width:1100px;margin-inline:auto}
.mobile-top{display:none}
@media (max-width:1000px){
  .shell{display:block}
  .side{display:none}
  .mobile-top{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;padding:14px 16px}
  .mobile-top .logo{background:#fff;border-radius:8px;padding:5px 7px;display:flex}
  .mobile-top img{height:24px}
  .main{padding:20px 16px}
}

/* page header */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.ph .back{display:inline-block;color:var(--brand);font-size:14px;margin-bottom:4px}
.ph .back:hover{text-decoration:underline}
.ph h1{margin:0;font-size:24px;color:var(--navy);line-height:1.3}
.ph p{margin:4px 0 0;color:var(--muted);font-size:14px}
.ph .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border-radius:8px;font-size:14px;font-weight:600;transition:background .15s}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-hover)}
.btn.primary:disabled{opacity:.6}
.btn.secondary{border:1px solid var(--input);background:#fff;font-weight:500;padding:0 16px}
.btn.secondary:hover{background:var(--bg)}
.btn.danger{border:1px solid #e7c3c1;background:#fff;color:var(--danger);font-weight:500;padding:0 16px}
.btn.danger:hover,.btn.danger.armed{background:#fcf1f0}
.btn.danger.armed{font-weight:600}
.btn.danger:disabled{opacity:.55}
.icon-btn{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:#4d4d4d}
.icon-btn:hover{background:var(--line-2)}
.icon-btn:disabled{opacity:.3;background:none}
.link{color:var(--brand);font-size:13px;border-radius:6px;padding:4px 8px}
.link:hover{background:var(--info-bg)}
.del{color:var(--danger);font-size:13px;border-radius:6px;padding:4px 8px}
.del:hover,.del.armed{background:#fcf1f0}
.del.armed{font-weight:600}

/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;scroll-margin-top:24px}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:16px;color:var(--navy)}
.card-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.card-b{padding:20px}
.stack{display:grid;gap:20px}

/* forms */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.field{display:grid;gap:6px;align-content:start}
.field label.l{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.hint{font-size:12.5px;color:var(--muted-2);margin:0}
.error{font-size:12.5px;color:var(--danger);margin:0}
.in{width:100%;border:1px solid var(--input);border-radius:8px;background:#fff;padding:10px 12px;font:inherit;font-size:14.5px;color:var(--ink);outline:none;transition:border-color .15s, box-shadow .15s}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(6,118,189,.15)}
.in.invalid{border-color:var(--pdf)}
textarea.in{resize:vertical}
select.in{appearance:auto}
.check{display:flex;align-items:center;gap:10px;height:46px;border:1px solid var(--input);border-radius:8px;padding:0 12px;cursor:pointer;background:#fff}
.check input{width:16px;height:16px;accent-color:var(--brand)}

.tabs{display:flex;gap:4px;width:fit-content;background:var(--line-2);border-radius:8px;padding:4px}
.tabs button{display:flex;align-items:center;gap:6px;border-radius:6px;padding:6px 16px;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs .dot{width:6px;height:6px;border-radius:50%;background:#2f9458}

/* notices + badges */
.notice{border:1px solid;border-radius:8px;padding:10px 16px;font-size:14px;margin:0}
.notice.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.notice.err{background:var(--err-bg);border-color:var(--err-line);color:var(--err)}
.notice.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:500;white-space:nowrap}
.b-green{background:#e6f6ec;color:var(--ok)}
.b-gray{background:var(--line-2);color:var(--muted)}
.b-amber{background:#fdf3e1;color:#8a5a0b}
.b-blue{background:#e8f3fb;color:#0b5d95}
.pdf-tag{background:var(--pdf);color:#fff;font-family:var(--latin);font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;text-align:start;transition:border-color .15s}
a.stat:hover,button.stat:hover{border-color:rgba(6,118,189,.4)}
.stat p{margin:0;font-size:13px;color:var(--muted)}
.stat b{display:block;margin-top:4px;font-family:var(--latin);font-size:30px;color:var(--navy);line-height:1.2}
.stat small{font-size:12px;color:var(--muted-2)}

/* lists */
.rows{list-style:none;margin:-8px 0;padding:0}
.rows li+li{border-top:1px solid var(--line-2)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:12px 8px;margin-inline:-8px;border-radius:8px;width:calc(100% + 16px);text-align:start}
button.row:hover{background:#f7f9fb}
.row .t{display:grid;min-width:0;flex:1}
.row .t b{color:var(--navy);font-weight:600}
.row .t span{font-size:13px;color:var(--muted-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.thumb{width:56px;height:56px;border-radius:8px;display:grid;place-items:center;overflow:hidden;flex:none}
.thumb svg{width:92%;height:auto}
.cat-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.cat-ic svg{width:24px;height:24px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.filters .in{width:auto}
.filters .q{flex:1;max-width:290px}

/* media */
.imgs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;list-style:none;margin:0;padding:0}
@media (max-width:760px){.imgs{grid-template-columns:1fr 1fr}}
.imgs li{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.imgs .pic{position:relative;aspect-ratio:1;display:grid;place-items:center}
.imgs .pic svg{width:92%;height:auto}
.imgs .main-tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--navy);color:#fff;font-size:11px;border-radius:999px;padding:2px 8px}
.imgs .bar{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line-2);padding:4px 6px}
.drop{display:grid;place-items:center;gap:2px;text-align:center;border:2px dashed var(--input);border-radius:8px;padding:32px 16px;cursor:pointer;transition:all .15s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--info-bg)}
.drop b{color:var(--brand);font-size:14px}
.drop span{font-size:12px;color:var(--muted-2)}
.progress{height:4px;border-radius:4px;background:var(--line-2);overflow:hidden;width:220px;margin-top:6px}
.progress i{display:block;height:100%;background:var(--brand);transition:width .3s}
.certs{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px}
.certs li{padding:12px 16px;display:grid;gap:12px}
.certs li+li{border-top:1px solid var(--line-2)}
.certs .line{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.certs .t{display:grid;flex:1;min-width:0}
.certs .t b{color:var(--navy);font-weight:600}
.certs .t span{font-size:12.5px;color:var(--muted-2)}
.edit-box{background:#f7f9fb;border-radius:8px;padding:16px;display:grid;gap:12px}
.add-box{border:1px dashed var(--input);border-radius:8px;padding:16px;display:grid;gap:12px}
.add-box > b{font-size:14px;color:var(--navy)}
.file-in{font-size:14px}
.file-in::file-selector-button{border:0;border-radius:6px;background:var(--line-2);padding:8px 12px;margin-inline-end:12px;font:inherit;font-size:14px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{background:#fff;border-radius:999px;padding:4px 12px;color:var(--brand);font-size:14px;box-shadow:0 0 0 1px var(--line)}
.chips a:hover{box-shadow:0 0 0 1px rgba(6,118,189,.4)}

/* category editor */
.icons{display:flex;flex-wrap:wrap;gap:10px}
.icons button{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:2px solid transparent}
.icons button:hover{border-color:var(--input)}
.icons button[aria-pressed="true"]{border-color:var(--brand)}
.icons svg{width:32px;height:32px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatches button{width:36px;height:36px;border-radius:50%;border:2px solid var(--input)}
.swatches button[aria-pressed="true"]{border-color:var(--brand)}
.swatches input{width:48px;height:36px;border:1px solid var(--input);border-radius:4px;padding:2px;background:#fff;cursor:pointer}

/* login */
.login{min-height:calc(100vh - 42px);display:grid;place-items:center;background:var(--navy);padding:40px 16px}
.login .box{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:32px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);display:grid;gap:16px}
.login img{height:48px;width:auto}
.login h1{margin:8px 0 0;font-size:20px;color:var(--navy)}
.login p.sub{margin:0 0 8px;font-size:14px;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted-2);font-size:14px}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function label(x,y,w,h,p,acc,back){
  const b = BRANDS[p.brand].name;
  if (back) {
    let l=""; for(let i=0;i<6;i++) l+=`<rect x="${x+w*.12}" y="${y+h*.2+i*h*.1}" width="${w*(i%2?.6:.76)}" height="${h*.035}" rx="2" fill="#c9d2dc"/>`;
    let bc=""; for(let i=0;i<18;i++) bc+=`<rect x="${x+w*.2+i*w*.033}" y="${y+h*.82}" width="${i%3?w*.012:w*.022}" height="${h*.1}" fill="#333"/>`;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#fff"/>${l}${bc}`;
  }
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#fff"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h*.22}" rx="6" fill="${acc}"/><rect x="${x}" y="${y+h*.14}" width="${w}" height="${h*.08}" fill="${acc}"/>
  <text x="${x+w/2}" y="${y+h*.15}" text-anchor="middle" font-family="Roboto,Arial" font-weight="700" font-size="${h*.1}" fill="#fff">${esc(b)}</text>
  <text x="${x+w/2}" y="${y+h*.47}" text-anchor="middle" font-family="Roboto,Arial" font-weight="700" font-size="${Math.min(h*.13, w*1.5/Math.max(p.latin.length,6))}" fill="#12304f">${esc(p.latin)}</text>
  <rect x="${x+w*.25}" y="${y+h*.58}" width="${w*.5}" height="${h*.035}" rx="2" fill="#c9d2dc"/>
  <rect x="${x+w*.32}" y="${y+h*.66}" width="${w*.36}" height="${h*.035}" rx="2" fill="#c9d2dc"/>
  <circle cx="${x+w/2}" cy="${y+h*.83}" r="${h*.06}" fill="none" stroke="${acc}" stroke-width="2"/>`;
}
function item(p, acc, cx, base, s, back){
  // draws one pack centred at cx, standing on y=base, scale s
  const g = (inner) => `<g transform="translate(${cx} ${base}) scale(${s}) translate(-100 -300)">${inner}</g>`;
  if (p.pack === "bottle") return g(`
    <rect x="80" y="40" width="40" height="30" rx="4" fill="${acc}"/><rect x="86" y="68" width="28" height="22" fill="#e9eef3"/>
    <path d="M86 88 Q86 108 56 122 Q44 128 44 146 V286 Q44 300 58 300 H142 Q156 300 156 286 V146 Q156 128 144 122 Q114 108 114 88Z" fill="#f4f7fa" stroke="#d3dbe3" stroke-width="2"/>
    <path d="M60 136 V284" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".8"/>
    ${label(52,160,96,118,p,acc,back)}`);
  if (p.pack === "vial") return g(`
    <rect x="70" y="120" width="60" height="22" rx="4" fill="#b8c2cc"/><rect x="74" y="112" width="52" height="12" rx="3" fill="${acc}"/>
    <path d="M78 142 V156 Q60 164 60 182 V288 Q60 300 72 300 H128 Q140 300 140 288 V182 Q140 164 122 156 V142Z" fill="#eaf1f7" stroke="#cdd7e0" stroke-width="2" opacity=".95"/>
    <path d="M70 186 V284" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    ${label(64,196,72,88,p,acc,back)}`);
  if (p.pack === "tub") return g(`
    <rect x="42" y="118" width="116" height="28" rx="6" fill="${acc}"/><rect x="42" y="140" width="116" height="6" fill="rgba(0,0,0,.12)"/>
    <path d="M46 146 H154 L150 292 Q150 300 142 300 H58 Q50 300 50 292Z" fill="#f7f9fb" stroke="#d3dbe3" stroke-width="2"/>
    ${label(58,168,84,112,p,acc,back)}`);
  // bag
  return g(`
    <path d="M30 90 Q100 76 170 90 L176 110 Q182 200 172 290 Q100 304 28 290 Q18 200 24 110Z" fill="#f6f3ea" stroke="#d9d2bf" stroke-width="2"/>
    <path d="M30 90 Q100 76 170 90 L172 102 Q100 88 28 102Z" fill="#e2dccb"/>
    <path d="M40 100 Q34 200 40 282" stroke="#fff" stroke-width="6" opacity=".7" fill="none" stroke-linecap="round"/>
    ${label(46,128,108,140,p,acc,back)}`);
}
function shadow(cx, w){ return `<ellipse cx="${cx}" cy="352" rx="${w}" ry="10" fill="rgba(11,31,54,.14)"/>`; }
function packshot(p, v=0){
  const acc = catOf(p.cat).accent;
  let body;
  if (v === 0) body = shadow(200,80) + item(p,acc,200,350,1.05);
  else if (v === 1) body = shadow(200,70) + item(p,acc,200,350,1.05,true);
  else if (v === 2) body = shadow(120,50)+shadow(280,50)+shadow(200,60) + item(p,acc,120,330,.72) + item(p,acc,280,330,.72) + item(p,acc,200,352,.86);
  else body = `<g transform="translate(200 210) scale(1.9) translate(-100 -214)">${label(52,160,96,118,p,acc)}</g>`;
  return `<svg viewBox="0 0 400 400" role="img" aria-label="${esc(p.title)}">${body}</svg>`;
}

    ${card("المعلومات الأساسية", `<div class="grid2">
      ${field("القسم", `<select class="in ${err ? "" : ""}"><option value="" ${isNew ? "selected" : ""} disabled>اختر القسم…</option>${CATS.map(c => `<option ${!isNew && p.cat === c.id ? "selected" : ""}>${c.name}</option>`).join("")}</select>`)}
      ${field("البراند", `<input class="in latin" list="brands" value="${isNew ? "" : BRANDS[p.brand].name}"><datalist id="brands"><option value="HiPro"><option value="Vet Care"><option value="Jamuh"></datalist>`, { hint: "اكتب HiPro أو Vet Care أو Jamuh ليظهر شعار البراند تلقائياً." })}
      ${field("الاسم التجاري (كما على العبوة)", `<input class="in latin" value="${isNew ? "" : e(p.latin)}">`, { hint: "بالأحرف اللاتينية، مثل: AMOXI-VET 50%" })}
      ${field("الحالة", `<label class="check"><input type="checkbox" ${isNew || p.published ? "checked" : ""}> منشور على الموقع</label>`)}
    </div>`)}
    ${card("النصوص", `<div class="stack" style="gap:16px">
      ${err ? '<p class="error" style="font-size:13px">اكتب اسم المنتج بلغة واحدة على الأقل.</p>' : ""}
      ${tabs(isNew ? {} : { Ku: false, Ar: true, En: true })}
      ${field("اسم المنتج", `<input class="in ${err ? "invalid" : ""}" ${langAttrs(k)} value="${val("title")}">`)}
      ${field("وصف مختصر", `<textarea class="in" rows="3" ${langAttrs(k)}>${val("summary")}</textarea>`, { hint: "يظهر تحت اسم المنتج. جملتان أو ثلاث." })}
      <div class="grid3">
        ${field("الشكل الصيدلاني", `<input class="in" ${langAttrs(k)} value="${val("form")}">`)}
        ${field("العبوات المتوفرة", `<input class="in" ${langAttrs(k)} value="${val("size")}">`)}
        ${field("الحيوانات المستهدفة", `<input class="in" ${langAttrs(k)} value="${val("species")}">`)}
      </div>
      ${field("عن المنتج (وصف تفصيلي)", `<textarea class="in" rows="6" ${langAttrs(k)}>${val("description")}</textarea>`, { hint: "افصل بين الفقرات بسطر فارغ." })}
      ${field("طريقة الاستخدام", `<textarea class="in" rows="5" ${langAttrs(k)}>${val("usage")}</textarea>`, { hint: "كل خطوة في سطر مستقل، وتظهر كقائمة مرقّمة." })}
    </div>`, { desc: "اكتب النصوص بالكردية والعربية والإنجليزية. الحقل الفارغ في لغة ما يُعرض من لغة أخرى." })}
    ${card("إعدادات", `<div class="grid2">
      ${field("الرابط (Slug)", `<input class="in latin" value="${isNew ? "" : p.id}" placeholder="amoxi-vet-50">`, { hint: "اختياري. يُنشأ تلقائياً من الاسم الإنجليزي أو الاسم التجاري." })}
      ${field("الترتيب", `<input class="in latin" type="number" value="0" style="max-width:128px">`, { hint: "الرقم الأصغر يظهر أولاً في القوائم." })}
    </div>`)}
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
      <button class="btn primary" type="submit">${isNew ? "حفظ ومتابعة لإضافة الصور" : "حفظ التعديلات"}</button>
      <a href="#" class="link" data-go="products" style="color:var(--muted)">رجوع</a>
      ${isNew ? '<button type="button" class="link" data-form-error>عرض حالة خطأ التحقق</button>' : ""}
    </div>
  </form>`;
}

function vProductNew() {
  return shell("products", header("منتج جديد", { back: ["products", "المنتجات"] })
    + `<div class="stack" style="gap:16px"><p class="notice info">بعد حفظ المنتج ستنتقل لصفحة يمكنك فيها رفع الصور والشهادات.</p>${productForm(null, true)}</div>`);
}

function certTitleInputs(c) {
  return `<div class="grid3">
    ${field("العنوان بالكردية", `<input class="in" dir="rtl" placeholder="بڕوانامەی شیکاری" value="${c ? "" : ""}">`)}
    ${field("العنوان بالعربية", `<input class="in" dir="rtl" placeholder="شهادة تحليل المنتج (COA)" value="${c ? e(c.name) : ""}">`)}
    ${field("العنوان بالإنجليزية", `<input class="in latin" placeholder="Certificate of Analysis" value="">`)}
  </div>
  <div class="grid2">
    ${field("الجهة المُصدِرة", `<input class="in" dir="auto" placeholder="SGS" value="${c ? e(c.issuer) : ""}">`, { hint: "اختياري" })}
    ${field("تاريخ الإصدار", `<input class="in latin" placeholder="03/2026" value="${c ? c.date : ""}">`, { hint: "اختياري، كما هو مكتوب على الشهادة" })}
  </div>`;
}

function vProductEdit() {
  const p = prod(), c = catOf(p.cat);
  const imgs = p.images.length ? `<ul class="imgs">${p.images.map((v, i) => `<li>
      <div class="pic" style="background:${c.tint}">${packshot(p, v)}${i === 0 ? '<span class="main-tag">الصورة الرئيسية</span>' : ""}</div>
      <div class="bar"><div style="display:flex">
        <button type="button" class="icon-btn" data-img-move="${i}:-1" ${i === 0 ? "disabled" : ""} aria-label="تقديم" title="تقديم">${I.up}</button>
        <button type="button" class="icon-btn" data-img-move="${i}:1" ${i === p.images.length - 1 ? "disabled" : ""} aria-label="تأخير" title="تأخير">${I.down}</button></div>
        <button type="button" class="del" data-two-click="img:${i}">حذف</button></div></li>`).join("")}</ul>` : "";
  const up = state.upload;
  const images = card("صور المنتج", `<div class="stack" style="gap:16px">${imgs}
      <label class="drop" id="drop">${up ? `<b>جارٍ رفع ${up.done + 1} من ${up.total}…</b><span class="progress"><i style="width:${Math.round((up.done + .5) / up.total * 100)}%"></i></span>` : `<b>اختر صوراً أو اسحبها إلى هنا</b><span>يمكنك اختيار أكثر من صورة مرة واحدة</span>`}
        <input type="file" multiple accept="image/jpeg,image/png,image/webp" hidden id="img-input"></label>
      ${state.uploadError ? '<p class="notice err" role="alert">fake.pdf: الملف ليس صورة صالحة. استخدم JPG أو PNG أو WEBP.</p>' : ""}
    </div>`, { id: "images", desc: "الصورة الأولى هي الصورة الرئيسية في البطاقات. الصور بخلفية بيضاء تبدو أفضل. JPG أو PNG أو WEBP حتى 15MB، وتُصغَّر تلقائياً." });

  const certs = card("الشهادات (PDF)", `<div class="stack" style="gap:20px">
      ${p.certs.length ? `<ul class="certs">${p.certs.map((ct, i) => `<li>
        <div class="line"><span class="pdf-tag">PDF</span>
          <span class="t"><b>${e(ct.name)}</b><span><bdi>${e(ct.issuer)}</bdi> · <bdi>${ct.date}</bdi> · <bdi>${ct.size}</bdi>${i === 1 ? " · ترجمة ناقصة" : ""}</span></span>
          <a href="#" class="link" data-noop>فتح</a>
          <button type="button" class="link" data-edit-cert="${ct.id}">تعديل</button>
          <button type="button" class="icon-btn" data-cert-move="${i}:-1" ${i === 0 ? "disabled" : ""} aria-label="تقديم">${I.up}</button>
          <button type="button" class="icon-btn" data-cert-move="${i}:1" ${i === p.certs.length - 1 ? "disabled" : ""} aria-label="تأخير">${I.down}</button>
          <button type="button" class="del" data-two-click="cert:${i}">حذف</button></div>
        ${state.editingCert === ct.id ? `<div class="edit-box">${certTitleInputs(ct)}<div style="display:flex;gap:8px"><button type="button" class="btn primary" data-edit-cert="">حفظ</button><button type="button" class="btn secondary" data-edit-cert="">إلغاء</button></div></div>` : ""}
      </li>`).join("")}</ul>` : ""}
      <form class="add-box" method="post" id="cert-form"><b>إضافة شهادة</b>
        ${field("ملف PDF", `<input type="file" class="file-in" accept="application/pdf,.pdf">`)}
        ${certTitleInputs(null)}
        ${state.certAdded ? '<p class="notice ok">تمت إضافة الشهادة.</p>' : ""}
        <div><button class="btn primary" type="submit">رفع الشهادة</button></div>
      </form></div>`, { id: "certificates", desc: "تظهر في صفحة المنتج، ويفتحها الزائر داخل الصفحة. PDF حتى 20MB." });

  const del = card("حذف المنتج", `<button type="button" class="btn danger" data-two-click="product">حذف هذا المنتج</button>`, { desc: "يحذف المنتج وكل صوره وشهاداته نهائياً." });

  return shell("products", header(e(p.title), { back: ["products", "المنتجات"],
      actions: `${p.published ? '<span class="badge b-green">منشور</span><a href="#" class="btn secondary" data-noop>عرض على الموقع ↗</a>' : '<span class="badge b-gray">مسودة — غير ظاهر على الموقع</span>'}` })
    + notice()
    + `<div class="stack"><nav class="chips"><a href="#images">الصور (${p.images.length})</a><a href="#certificates">الشهادات (${p.certs.length})</a></nav>
      ${productForm(p, false)}${images}${certs}${del}</div>`);
}

function vCategories() {
  return shell("categories", header("الأقسام", { desc: "كل قسم له صفحة خاصة على الموقع تعرض المنتجات التابعة له.", actions: `<button class="btn primary" data-go="category-new">قسم جديد</button>` })
    + notice()
    + card("", `<ul class="rows">${CATS.map((c, i) => `<li><button class="row" data-cat="${c.id}">
        <span class="cat-ic" style="background:${c.tint}">${ICONS[c.id]}</span>
        <span class="t"><b>${c.name}</b><span>${c.ku} · <bdi>${c.en}</bdi> · <span class="latin">/${c.id}</span></span></span>
        <span class="badges">${i === 3 ? '<span class="badge b-amber">ترجمة ناقصة: En</span>' : ""}<span class="badge b-blue">${countIn(c.id)} منتج</span><span class="latin" style="font-size:12px;color:var(--muted-3)">#${c.order}</span></span>
      </button></li>`).join("")}</ul>`));
}

function categoryForm(c, isNew) {
  const k = state.tab;
  const tint = state.catColor || (c ? c.tint : COLORS[0]);
  const icon = state.catIcon || (c ? c.id : "medicines");
  return `<form class="stack" method="post" id="category-form">
    ${card("الاسم والوصف", `<div class="stack" style="gap:16px">
      ${tabs(isNew ? {} : { Ku: true, Ar: true, En: true })}
      ${field("اسم القسم", `<input class="in" ${langAttrs(k)} value="${isNew ? "" : e(k === "Ku" ? c.ku : k === "En" ? c.en : c.name)}">`)}
      ${field("وصف قصير", `<textarea class="in" rows="2" ${langAttrs(k)}>${isNew || k !== "Ar" ? "" : e(c.blurb)}</textarea>`, { hint: "يظهر على بطاقة القسم وفي أعلى صفحة القسم. سطر أو سطران." })}
    </div>`, { desc: "اكتب الاسم بالكردية والعربية والإنجليزية. إذا تركت لغة فارغة يظهر الاسم من لغة أخرى." })}
    ${card("الأيقونة واللون", `<div class="grid2">
      ${field("الأيقونة", `<div class="icons">${Object.keys(ICONS).map(id => `<button type="button" data-icon="${id}" aria-pressed="${icon === id}" style="background:${tint}">${ICONS[id]}</button>`).join("")}</div>
        <label class="link" style="width:fit-content;padding:0;margin-top:4px;cursor:pointer">أو ارفع أيقونة خاصة (PNG بخلفية شفافة، حتى 2MB)<input type="file" hidden accept="image/png,image/jpeg,image/webp"></label>`)}
      ${field("لون الخلفية", `<div class="swatches">${COLORS.map(col => `<button type="button" data-color="${col}" aria-pressed="${tint === col}" aria-label="${col}" style="background:${col}"></button>`).join("")}<input type="color" value="${tint}" aria-label="لون مخصص" id="custom-color"></div>`, { hint: "يظهر خلف الأيقونة وخلف صور منتجات هذا القسم." })}
    </div>`)}
    ${card("إعدادات", `<div class="grid2">
      ${field("الرابط (Slug)", `<input class="in latin" value="${isNew ? "" : c.id}" placeholder="poultry-care">`, { hint: "اختياري. يظهر في عنوان الصفحة: /products/الرابط. إذا تركته فارغاً يُنشأ من الاسم الإنجليزي." })}
      ${field("الترتيب", `<input class="in latin" type="number" value="${isNew ? 0 : c.order}" style="max-width:128px">`, { hint: "الرقم الأصغر يظهر أولاً." })}
    </div>`)}
    <div style="display:flex;gap:12px;align-items:center"><button class="btn primary" type="submit">${isNew ? "إضافة القسم" : "حفظ التعديلات"}</button><a href="#" class="link" data-go="categories" style="color:var(--muted)">رجوع</a></div>
  </form>`;
}

function vCategoryNew() { return shell("categories", header("قسم جديد", { back: ["categories", "الأقسام"] }) + categoryForm(null, true)); }

function vCategoryEdit() {
  const c = cat(), n = countIn(c.id);
  return shell("categories", header(c.name, { back: ["categories", "الأقسام"],
      actions: `<button class="btn secondary" data-filter-cat="${c.id}">منتجات القسم (${n})</button><a href="#" class="btn secondary" data-noop>عرض على الموقع ↗</a>` })
    + notice()
    + `<div class="stack">${categoryForm(c, false)}
      ${card("حذف القسم", `<div style="display:grid;gap:8px"><button type="button" class="btn danger" data-two-click="category" ${n ? "disabled" : ""} style="width:fit-content">حذف هذا القسم</button>
        ${n ? `<p class="hint">لا يمكن حذف القسم لأن فيه ${n} منتج. انقل المنتجات لقسم آخر أو احذفها أولاً.</p>` : ""}</div>`)}</div>`);
}

/* ---------------- Render + events ---------------- */
const SCREENS = [
  ["login", "تسجيل الدخول"], ["dashboard", "الرئيسية"], ["products", "المنتجات"], ["product-new", "منتج جديد"],
  ["product-edit", "تعديل منتج + صور + شهادات"], ["categories", "الأقسام"], ["category-new", "قسم جديد"], ["category-edit", "تعديل قسم"],
];
function render() {
  const views = { login: vLogin, dashboard: vDashboard, products: vProducts, "product-new": vProductNew, "product-edit": vProductEdit, categories: vCategories, "category-new": vCategoryNew, "category-edit": vCategoryEdit };
  root.innerHTML = views[state.view]();
  document.getElementById("screens").innerHTML = SCREENS.map(([k, l], i) => `<button data-screen="${k}" aria-current="${state.view === k}">${i + 1} · ${l}</button>`).join("");
}
document.getElementById("screens").addEventListener("click", ev => {
  const b = ev.target.closest("[data-screen]"); if (!b) return;
  go(b.dataset.screen, { tab: b.dataset.screen.endsWith("edit") ? "Ar" : "Ku", catColor: null, catIcon: null, formError: false, uploadError: false, certAdded: false, loginError: false });
});

let armedTimer = null;
root.addEventListener("click", ev => {
  const t = ev.target.closest("[data-go],[data-product],[data-cat],[data-tab],[data-two-click],[data-img-move],[data-cert-move],[data-edit-cert],[data-icon],[data-color],[data-clear],[data-filter-cat],[data-noop],[data-login-error],[data-form-error]");
  if (!t) return;
  if (t.tagName === "A" && !t.getAttribute("href").startsWith("#images") && !t.getAttribute("href").startsWith("#certificates")) ev.preventDefault();
  const d = t.dataset;
  if (d.go) return go(d.go, { tab: "Ku", catColor: null, catIcon: null, formError: false, uploadError: false, certAdded: false, loginError: false });
  if (d.product) return go("product-edit", { productId: d.product, tab: "Ar" });
  if (d.cat) return go("category-edit", { catId: d.cat, tab: "Ar", catColor: null, catIcon: null });
  if (d.tab) { state.tab = d.tab; return render(); }
  if (d.loginError !== undefined) { state.loginError = true; return render(); }
  if (d.formError !== undefined) { state.formError = true; return render(); }
  if (d.clear !== undefined) { state.filter = { q: "", cat: "", status: "" }; return render(); }
  if (d.filterCat) { state.filter = { q: "", cat: d.filterCat, status: "" }; return go("products"); }
  if (d.icon) { state.catIcon = d.icon; return render(); }
  if (d.color) { state.catColor = d.color; return render(); }
  if (d.editCert !== undefined) { state.editingCert = d.editCert || null; return render(); }
  if (d.imgMove || d.certMove) {
    const p = prod(), list = d.imgMove ? p.images : p.certs;
    const [i, dir] = (d.imgMove || d.certMove).split(":").map(Number);
    [list[i], list[i + dir]] = [list[i + dir], list[i]];
    return render();
  }
  if (d.twoClick) {
    // Two-click delete: first click arms the button for 4 seconds, second click deletes.
    if (!t.classList.contains("armed")) {
      t.classList.add("armed"); t.dataset.label = t.textContent;
      t.textContent = t.classList.contains("del") ? "اضغط للتأكيد" : "اضغط مرة أخرى للتأكيد";
      clearTimeout(armedTimer);
      armedTimer = setTimeout(() => { t.classList.remove("armed"); t.textContent = t.dataset.label; }, 4000);
      return;
    }
    const [kind, idx] = d.twoClick.split(":"), p = prod();
    if (kind === "img") p.images.splice(+idx, 1);
    if (kind === "cert") p.certs.splice(+idx, 1);
    if (kind === "product") { PRODUCTS.splice(PRODUCTS.indexOf(p), 1); state.productId = PRODUCTS[0].id; return go("products", { notice: ["ok", "تم حذف المنتج وملفاته."] }); }
    if (kind === "category") return go("categories", { notice: ["ok", "تم حذف القسم."] });
    return render();
  }
});
root.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === "login-form") return go("dashboard");
  if (f.id === "filters") { const fd = new FormData(f); state.filter = { q: fd.get("q").trim(), cat: fd.get("cat"), status: fd.get("status") }; return render(); }
  if (f.id === "product-form") return state.view === "product-new" ? go("product-edit", { notice: ["ok", "تم إنشاء المنتج. أضف الصور والشهادات من الأسفل."], tab: "Ar" }) : (state.notice = ["ok", "تم حفظ التعديلات."], render(), window.scrollTo(0, 0));
  if (f.id === "category-form") return state.view === "category-new" ? go("categories", { notice: ["ok", "تمت إضافة القسم."] }) : (state.notice = ["ok", "تم حفظ التعديلات."], render(), window.scrollTo(0, 0));
  if (f.id === "cert-form") { state.certAdded = true; return render(); }
});
root.addEventListener("change", ev => {
  if (ev.target.id === "custom-color") { state.catColor = ev.target.value; render(); }
  if (ev.target.id === "img-input") simulateUpload(ev.target.files.length || 2);
});
root.addEventListener("dragover", ev => { const d = ev.target.closest("#drop"); if (d) { ev.preventDefault(); d.classList.add("over"); } });
root.addEventListener("dragleave", ev => { const d = ev.target.closest("#drop"); if (d) d.classList.remove("over"); });
root.addEventListener("drop", ev => { const d = ev.target.closest("#drop"); if (d) { ev.preventDefault(); simulateUpload(ev.dataTransfer.files.length || 1); } });
function simulateUpload(total) {
  let done = 0; state.upload = { done, total }; render();
  const tick = setInterval(() => {
    done++; const p = prod(); p.images.push(done % 3);
    if (done >= total) { clearInterval(tick); state.upload = null; } else state.upload = { done, total };
    render();
  }, 700);
}
render();
</script>
</body>
</html>
