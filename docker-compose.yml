services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3009
      - DATABASE_URL=${INTERNAL_DATABASE_URL:-postgresql://${POSTGRES_USER:-idvet}:${POSTGRES_PASSWORD:-idvet}@db:5432/${POSTGRES_DB:-idvet}}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://idvet.co}
      # Admin dashboard (/admin). The login page lists whichever of these is missing.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
      - UPLOAD_DIR=/app/storage/uploads
      # Email (lib/mailer.ts); an empty SMTP_HOST means submissions are only saved, not emailed.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_TO=${MAIL_TO:-admin@idvet.co, info@idvet.co}
    volumes:
      - idvet_uploads:/app/storage/uploads
    ports:
      - "3009:3009"
    depends_on:
      db:
        condition: service_healthy
      # The app only starts once the database schema is up to date.
      migrate:
        condition: service_completed_successfully
    networks:
      - traefik_webgateway
      - idvet_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_webgateway"
      # Route HTTPS traffic for idvet.co and www.idvet.co
      - "traefik.http.routers.idvet.rule=Host(`idvet.co`) || Host(`www.idvet.co`)"
      - "traefik.http.routers.idvet.entrypoints=websecure"
      - "traefik.http.routers.idvet.tls=true"
      - "traefik.http.routers.idvet.tls.certresolver=myresolver"
      - "traefik.http.routers.idvet.service=idvet"
      # Middlewares: Redirect www to apex domain + Gzip/Brotli compression
      - "traefik.http.routers.idvet.middlewares=idvet-redirect-www,idvet-compress"
      - "traefik.http.middlewares.idvet-redirect-www.redirectregex.regex=^https?://www\\.idvet\\.co/(.*)"
      - "traefik.http.middlewares.idvet-redirect-www.redirectregex.replacement=https://idvet.co/$${1}"
      - "traefik.http.middlewares.idvet-redirect-www.redirectregex.permanent=true"
      - "traefik.http.middlewares.idvet-compress.compress=true"
      # Service loadbalancer port
      - "traefik.http.services.idvet.loadbalancer.server.port=3009"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idvet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idvet}
      POSTGRES_DB: ${POSTGRES_DB:-idvet}
    volumes:
      - idvet_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idvet} -d ${POSTGRES_DB:-idvet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - idvet_internal

  # Applies pending database migrations (the first one also seeds the 4 product
  # categories), then exits. Runs on every `docker compose up`, before the app
  # starts; with nothing pending it's a no-op. Manual run:
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      - DATABASE_URL=${INTERNAL_DATABASE_URL:-postgresql://${POSTGRES_USER:-idvet}:${POSTGRES_PASSWORD:-idvet}@db:5432/${POSTGRES_DB:-idvet}}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - idvet_internal

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8091:8080"
    depends_on:
      - db
    networks:
      - idvet_internal

volumes:
  idvet_db_data:
  idvet_uploads:

networks:
  traefik_webgateway:
    external: true
  idvet_internal:
    driver: bridge
