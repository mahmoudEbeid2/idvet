services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: idvet
      POSTGRES_PASSWORD: idvet
      POSTGRES_DB: idvet
    ports:
      - "5434:5432"
    volumes:
      - idvet_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idvet -d idvet"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8091:8080"
    depends_on:
      - db

volumes:
  idvet_db_data:
